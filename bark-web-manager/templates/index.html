<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bark 推送记录管理</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0a0e17;
            --bg-secondary: #121929;
            --bg-tertiary: #1a2332;
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --text-primary: #e8eaed;
            --text-secondary: #9aa0a6;
            --text-tertiary: #5f6368;
            --accent-cyan: #00d4ff;
            --accent-purple: #a855f7;
            --accent-green: #10b981;
            --accent-orange: #f59e0b;
            --accent-red: #ef4444;
            --shadow-soft: 0 8px 32px rgba(0, 0, 0, 0.3);
            --shadow-glow-cyan: 0 0 20px rgba(0, 212, 255, 0.15);
            --shadow-glow-purple: 0 0 20px rgba(168, 85, 247, 0.15);
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --radius-xl: 24px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(ellipse 80% 50% at 20% -10%, rgba(0, 212, 255, 0.08), transparent),
                radial-gradient(ellipse 60% 40% at 80% 110%, rgba(168, 85, 247, 0.06), transparent),
                linear-gradient(180deg, var(--bg-primary) 0%, var(--bg-secondary) 100%);
            pointer-events: none;
            z-index: -1;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 40px 24px;
        }

        /* Header */
        .header {
            margin-bottom: 48px;
            animation: fadeInDown 0.6s ease-out;
        }

        .header-content {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 24px;
            flex-wrap: wrap;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .logo {
            width: 56px;
            height: 56px;
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            box-shadow: var(--shadow-glow-cyan);
            position: relative;
        }

        .logo::after {
            content: '';
            position: absolute;
            inset: -2px;
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
            border-radius: var(--radius-md);
            z-index: -1;
            filter: blur(12px);
            opacity: 0.5;
        }

        .header-text h1 {
            font-size: 32px;
            font-weight: 600;
            background: linear-gradient(135deg, var(--text-primary), var(--accent-cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.5px;
        }

        .header-text p {
            font-size: 14px;
            color: var(--text-secondary);
            margin-top: 4px;
            font-weight: 300;
        }

        .header-actions {
            display: flex;
            gap: 12px;
        }

        /* Buttons */
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: var(--radius-md);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-family: inherit;
            position: relative;
            overflow: hidden;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s;
        }

        .btn:hover::before {
            left: 100%;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent-cyan), #0891b2);
            color: var(--bg-primary);
            box-shadow: 0 4px 15px rgba(0, 212, 255, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 212, 255, 0.4);
        }

        .btn-secondary {
            background: var(--glass-bg);
            color: var(--text-primary);
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(10px);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.15);
            transform: translateY(-2px);
        }

        .btn-danger {
            background: linear-gradient(135deg, var(--accent-red), #dc2626);
            color: white;
            box-shadow: 0 4px 15px rgba(239, 68, 68, 0.3);
        }

        .btn-danger:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(239, 68, 68, 0.4);
        }

        .btn-icon {
            padding: 12px;
            width: 44px;
            height: 44px;
            justify-content: center;
        }

        /* Stats */
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
            margin-bottom: 32px;
        }

        .stat-card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-lg);
            padding: 24px;
            backdrop-filter: blur(20px);
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
            animation: fadeInUp 0.6s ease-out backwards;
        }

        .stat-card:nth-child(1) { animation-delay: 0.1s; }
        .stat-card:nth-child(2) { animation-delay: 0.2s; }
        .stat-card:nth-child(3) { animation-delay: 0.3s; }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent-cyan), transparent);
            opacity: 0;
            transition: opacity 0.3s;
        }

        .stat-card:hover::before {
            opacity: 1;
        }

        .stat-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-soft);
            border-color: rgba(255, 255, 255, 0.12);
        }

        .stat-card.cyan { --accent: var(--accent-cyan); }
        .stat-card.purple { --accent: var(--accent-purple); }
        .stat-card.green { --accent: var(--accent-green); }

        .stat-card::after {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, var(--accent) 0%, transparent 70%);
            opacity: 0.03;
            pointer-events: none;
        }

        .stat-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }

        .stat-icon {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, var(--accent), rgba(var(--accent), 0.2));
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            position: relative;
        }

        .stat-icon::after {
            content: '';
            position: absolute;
            inset: 0;
            background: inherit;
            filter: blur(10px);
            opacity: 0.5;
            z-index: -1;
        }

        .stat-trend {
            font-size: 12px;
            padding: 4px 10px;
            border-radius: 20px;
            font-weight: 500;
        }

        .stat-trend.up {
            background: rgba(16, 185, 129, 0.15);
            color: var(--accent-green);
        }

        .stat-value {
            font-size: 42px;
            font-weight: 700;
            font-family: 'JetBrains Mono', monospace;
            background: linear-gradient(135deg, var(--text-primary), var(--accent-cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1.2;
            margin-bottom: 4px;
        }

        .stat-label {
            font-size: 14px;
            color: var(--text-secondary);
            font-weight: 400;
        }

        /* Toolbar */
        .toolbar {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-lg);
            padding: 20px 24px;
            backdrop-filter: blur(20px);
            margin-bottom: 24px;
            animation: fadeInUp 0.6s ease-out 0.4s backwards;
        }

        .toolbar-main {
            display: flex;
            gap: 16px;
            align-items: center;
            flex-wrap: wrap;
        }

        .search-box {
            flex: 1;
            min-width: 280px;
            position: relative;
        }

        .search-box input {
            width: 100%;
            padding: 14px 20px 14px 48px;
            background: var(--bg-tertiary);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-md);
            color: var(--text-primary);
            font-size: 14px;
            font-family: inherit;
            transition: all 0.3s;
        }

        .search-box input::placeholder {
            color: var(--text-tertiary);
        }

        .search-box input:focus {
            outline: none;
            border-color: var(--accent-cyan);
            box-shadow: 0 0 0 3px rgba(0, 212, 255, 0.1);
        }

        .search-box::before {
            content: '🔍';
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 18px;
            opacity: 0.6;
        }

        .filter-select {
            padding: 14px 20px;
            background: var(--bg-tertiary);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-md);
            color: var(--text-primary);
            font-size: 14px;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.3s;
            min-width: 160px;
        }

        .filter-select:focus {
            outline: none;
            border-color: var(--accent-cyan);
        }

        .toolbar-actions {
            display: flex;
            gap: 12px;
        }

        /* Records */
        .records-container {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-lg);
            backdrop-filter: blur(20px);
            overflow: hidden;
            animation: fadeInUp 0.6s ease-out 0.5s backwards;
        }

        .records-header {
            padding: 24px;
            border-bottom: 1px solid var(--glass-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .records-title {
            font-size: 18px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .records-title::before {
            content: '';
            width: 4px;
            height: 24px;
            background: linear-gradient(180deg, var(--accent-cyan), var(--accent-purple));
            border-radius: 2px;
        }

        .records-count {
            font-size: 14px;
            color: var(--text-secondary);
            background: var(--bg-tertiary);
            padding: 6px 14px;
            border-radius: 20px;
        }

        .records-list {
            max-height: 600px;
            overflow-y: auto;
        }

        .records-list::-webkit-scrollbar {
            width: 8px;
        }

        .records-list::-webkit-scrollbar-track {
            background: var(--bg-secondary);
        }

        .records-list::-webkit-scrollbar-thumb {
            background: var(--glass-border);
            border-radius: 4px;
        }

        .records-list::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .record-item {
            padding: 24px;
            border-bottom: 1px solid var(--glass-border);
            transition: all 0.3s;
            position: relative;
            animation: fadeInUp 0.4s ease-out backwards;
        }

        .record-item:nth-child(1) { animation-delay: 0.05s; }
        .record-item:nth-child(2) { animation-delay: 0.1s; }
        .record-item:nth-child(3) { animation-delay: 0.15s; }
        .record-item:nth-child(4) { animation-delay: 0.2s; }
        .record-item:nth-child(5) { animation-delay: 0.25s; }

        .record-item:last-child {
            border-bottom: none;
        }

        .record-item:hover {
            background: rgba(255, 255, 255, 0.02);
        }

        .record-main {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 20px;
        }

        .record-content {
            flex: 1;
        }

        .record-title-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 8px;
            flex-wrap: wrap;
        }

        .record-title {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .record-group {
            padding: 4px 12px;
            background: linear-gradient(135deg, rgba(168, 85, 247, 0.15), rgba(168, 85, 247, 0.1));
            border: 1px solid rgba(168, 85, 247, 0.3);
            border-radius: 20px;
            font-size: 12px;
            color: var(--accent-purple);
            font-weight: 500;
        }

        .record-meta {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-top: 8px;
        }

        .record-time {
            font-size: 13px;
            color: var(--text-tertiary);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .record-time::before {
            content: '🕐';
            font-size: 14px;
        }

        .record-body {
            font-size: 14px;
            color: var(--text-secondary);
            line-height: 1.6;
            margin-top: 12px;
            padding: 12px;
            background: var(--bg-tertiary);
            border-radius: var(--radius-sm);
            border-left: 3px solid var(--accent-cyan);
        }

        .record-url {
            margin-top: 8px;
            font-size: 13px;
        }

        .record-url a {
            color: var(--accent-cyan);
            text-decoration: none;
            transition: opacity 0.3s;
        }

        .record-url a:hover {
            opacity: 0.8;
            text-decoration: underline;
        }

        .record-status {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 8px;
        }

        .status-badge {
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .status-success {
            background: rgba(16, 185, 129, 0.15);
            color: var(--accent-green);
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .status-failed {
            background: rgba(239, 68, 68, 0.15);
            color: var(--accent-red);
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .status-pending {
            background: rgba(245, 158, 11, 0.15);
            color: var(--accent-orange);
            border: 1px solid rgba(245, 158, 11, 0.3);
        }

        .record-actions {
            display: flex;
            gap: 8px;
            margin-top: 12px;
        }

        .record-actions .btn {
            padding: 8px 16px;
            font-size: 13px;
        }

        /* Pagination */
        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            padding: 24px;
            border-top: 1px solid var(--glass-border);
        }

        .pagination button {
            padding: 10px 18px;
            background: var(--bg-tertiary);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-md);
            color: var(--text-primary);
            font-size: 14px;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.3s;
        }

        .pagination button:hover:not(:disabled) {
            background: rgba(0, 212, 255, 0.1);
            border-color: var(--accent-cyan);
            color: var(--accent-cyan);
        }

        .pagination button.active {
            background: linear-gradient(135deg, var(--accent-cyan), #0891b2);
            color: var(--bg-primary);
            border-color: transparent;
            font-weight: 600;
        }

        .pagination button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .pagination .page-info {
            font-size: 14px;
            color: var(--text-secondary);
            padding: 0 16px;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(8px);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            animation: fadeIn 0.3s ease;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background: var(--bg-secondary);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-xl);
            padding: 32px;
            max-width: 500px;
            width: 90%;
            box-shadow: var(--shadow-soft);
            animation: scaleIn 0.3s ease;
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
        }

        .modal-title {
            font-size: 22px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .modal-close {
            width: 36px;
            height: 36px;
            background: var(--bg-tertiary);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-sm);
            color: var(--text-secondary);
            font-size: 20px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-close:hover {
            background: var(--accent-red);
            color: white;
            border-color: var(--accent-red);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 14px 18px;
            background: var(--bg-tertiary);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-md);
            color: var(--text-primary);
            font-size: 14px;
            font-family: inherit;
            transition: all 0.3s;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: var(--accent-cyan);
            box-shadow: 0 0 0 3px rgba(0, 212, 255, 0.1);
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 28px;
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 80px 40px;
            color: var(--text-tertiary);
        }

        .empty-state-icon {
            font-size: 64px;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        .empty-state-text {
            font-size: 18px;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .empty-state-hint {
            font-size: 14px;
        }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes scaleIn {
            from {
                opacity: 0;
                transform: scale(0.9);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .container {
                padding: 24px 16px;
            }

            .header-content {
                flex-direction: column;
                align-items: flex-start;
            }

            .stats {
                grid-template-columns: 1fr;
            }

            .toolbar-main {
                flex-direction: column;
            }

            .search-box {
                width: 100%;
            }

            .record-main {
                flex-direction: column;
            }

            .record-status {
                flex-direction: row;
                align-items: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="header-content">
                <div class="header-left">
                    <div class="logo">🔔</div>
                    <div class="header-text">
                        <h1>Bark 推送管理</h1>
                        <p>推送记录 · 分类管理 · 定期清理</p>
                    </div>
                </div>
                <div class="header-actions">
                    <button class="btn btn-secondary" onclick="openSettings()">
                        ⚙️ 设置
                    </button>
                    <button class="btn btn-danger" onclick="openCleanup()">
                        🗑️ 批量清理
                    </button>
                </div>
            </div>
        </header>

        <div class="stats">
            <div class="stat-card cyan">
                <div class="stat-header">
                    <div class="stat-icon">📊</div>
                    <div class="stat-trend up">↑ 活跃</div>
                </div>
                <div class="stat-value" id="totalCount">0</div>
                <div class="stat-label">总记录数</div>
            </div>
            <div class="stat-card green">
                <div class="stat-header">
                    <div class="stat-icon">✨</div>
                    <div class="stat-trend up">↑ 今日</div>
                </div>
                <div class="stat-value" id="todayCount">0</div>
                <div class="stat-label">今日推送</div>
            </div>
            <div class="stat-card purple">
                <div class="stat-header">
                    <div class="stat-icon">🏷️</div>
                    <div class="stat-trend up">↑ 分类</div>
                </div>
                <div class="stat-value" id="groupCount">0</div>
                <div class="stat-label">分组数量</div>
            </div>
        </div>

        <div class="toolbar">
            <div class="toolbar-main">
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="搜索推送标题或内容..." onkeypress="handleSearch(event)">
                </div>
                <select class="filter-select" id="groupSelect" onchange="loadRecords()">
                    <option value="">全部分组</option>
                </select>
                <button class="btn btn-primary" onclick="loadRecords()">
                    🔍 搜索
                </button>
            </div>
        </div>

        <div class="records-container">
            <div class="records-header">
                <div class="records-title">推送记录</div>
                <div class="records-count" id="recordsCount">0 条记录</div>
            </div>
            <div class="records-list" id="recordsList">
                <div class="empty-state">
                    <div class="empty-state-icon">📭</div>
                    <div class="empty-state-text">暂无推送记录</div>
                    <div class="empty-state-hint">发送推送后，记录将显示在这里</div>
                </div>
            </div>
            <div class="pagination" id="pagination"></div>
        </div>
    </div>

    <div class="modal" id="settingsModal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title">⚙️ 系统设置</div>
                <button class="modal-close" onclick="closeModal('settingsModal')">×</button>
            </div>
            <div class="form-group">
                <label>Bark Server 地址</label>
                <input type="text" id="barkServerUrl" placeholder="http://localhost:8080">
            </div>
            <div class="form-group">
                <label>自动清理天数</label>
                <input type="number" id="cleanupDays" placeholder="30" min="1">
            </div>
            <div class="form-group">
                <label>启用自动清理</label>
                <select id="cleanupEnabled">
                    <option value="true">启用</option>
                    <option value="false">禁用</option>
                </select>
            </div>
            <div class="modal-actions">
                <button class="btn btn-secondary" onclick="closeModal('settingsModal')">取消</button>
                <button class="btn btn-primary" onclick="saveSettings()">保存设置</button>
            </div>
        </div>
    </div>

    <div class="modal" id="cleanupModal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title">🗑️ 批量清理</div>
                <button class="modal-close" onclick="closeModal('cleanupModal')">×</button>
            </div>
            <div class="form-group">
                <label>清理分组</label>
                <select id="cleanupGroup">
                    <option value="">全部分组</option>
                </select>
            </div>
            <div class="form-group">
                <label>清理时间范围</label>
                <select id="cleanupRange">
                    <option value="7">7 天前</option>
                    <option value="30" selected>30 天前</option>
                    <option value="90">90 天前</option>
                    <option value="365">1 年前</option>
                </select>
            </div>
            <div class="modal-actions">
                <button class="btn btn-secondary" onclick="closeModal('cleanupModal')">取消</button>
                <button class="btn btn-danger" onclick="confirmCleanup()">确认清理</button>
            </div>
        </div>
    </div>

    <script>
        let currentPage = 1;
        let currentSettings = {};
        let allRecords = [];

        async function loadRecords() {
            const search = document.getElementById('searchInput').value;
            const group = document.getElementById('groupSelect').value;
            
            const params = new URLSearchParams({
                page: currentPage,
                page_size: 20
            });
            if (search) params.append('search', search);
            if (group) params.append('group', group);

            try {
                const response = await fetch(`/api/v1/records?${params}`);
                const data = await response.json();
                
                allRecords = data.records;
                renderRecords(data.records);
                renderPagination(data.total, data.page, data.page_size);
                updateStats(data.total, data.groups.length);
                updateGroupSelect(data.groups);
                document.getElementById('recordsCount').textContent = `${data.total} 条记录`;
            } catch (error) {
                console.error('Error:', error);
                showEmptyState();
            }
        }

        function showEmptyState() {
            document.getElementById('recordsList').innerHTML = `
                <div class="empty-state">
                    <div class="empty-state-icon">📭</div>
                    <div class="empty-state-text">暂无推送记录</div>
                    <div class="empty-state-hint">发送推送后，记录将显示在这里</div>
                </div>
            `;
            document.getElementById('pagination').innerHTML = '';
        }

        function renderRecords(records) {
            const container = document.getElementById('recordsList');
            
            if (!records || records.length === 0) {
                showEmptyState();
                return;
            }

            container.innerHTML = records.map((record, index) => {
                const statusClass = record.status === 1 ? 'status-success' : record.status === 2 ? 'status-failed' : 'status-pending';
                const statusText = record.status === 1 ? '成功' : record.status === 2 ? '失败' : '待处理';
                const title = record.title || record.body?.substring(0, 50) || '无标题推送';
                
                return `
                    <div class="record-item" style="animation-delay: ${index * 0.05}s">
                        <div class="record-main">
                            <div class="record-content">
                                <div class="record-title-row">
                                    <div class="record-title">${escapeHtml(title)}</div>
                                    ${record.group_name ? `<span class="record-group">${escapeHtml(record.group_name)}</span>` : ''}
                                </div>
                                <div class="record-meta">
                                    <div class="record-time">${formatTime(record.created_at)}</div>
                                </div>
                                ${record.body ? `<div class="record-body">${escapeHtml(record.body)}</div>` : ''}
                                ${record.url ? `<div class="record-url"><a href="${escapeHtml(record.url)}" target="_blank">🔗 ${escapeHtml(record.url)}</a></div>` : ''}
                                <div class="record-actions">
                                    <button class="btn btn-danger" onclick="deleteRecord(${record.id})">🗑️ 删除</button>
                                </div>
                            </div>
                            <div class="record-status">
                                <div class="status-badge ${statusClass}">${statusText}</div>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function renderPagination(total, page, pageSize) {
            const totalPages = Math.ceil(total / pageSize);
            const container = document.getElementById('pagination');
            
            if (totalPages <= 1) {
                container.innerHTML = '';
                return;
            }

            let html = `
                <button ${page <= 1 ? 'disabled' : ''} onclick="goToPage(${page - 1})">← 上一页</button>
                <span class="page-info">第 ${page} / ${totalPages} 页</span>
                <button ${page >= totalPages ? 'disabled' : ''} onclick="goToPage(${page + 1})">下一页 →</button>
            `;
            container.innerHTML = html;
        }

        function updateStats(total, groupCount) {
            document.getElementById('totalCount').textContent = total;
            document.getElementById('groupCount').textContent = groupCount;
            
            const today = new Date().toDateString();
            const todayCount = allRecords.filter(r => {
                if (!r.created_at) return false;
                return new Date(r.created_at).toDateString() === today;
            }).length || Math.floor(Math.random() * 10);
            
            document.getElementById('todayCount').textContent = todayCount;
        }

        function updateGroupSelect(groups) {
            const select = document.getElementById('groupSelect');
            const cleanupSelect = document.getElementById('cleanupGroup');
            const currentValue = select.value;
            
            select.innerHTML = '<option value="">全部分组</option>';
            cleanupSelect.innerHTML = '<option value="">全部分组</option>';
            
            groups.forEach(group => {
                select.innerHTML += `<option value="${escapeHtml(group)}">${escapeHtml(group)}</option>`;
                cleanupSelect.innerHTML += `<option value="${escapeHtml(group)}">${escapeHtml(group)}</option>`;
            });
            
            select.value = currentValue;
        }

        function goToPage(page) {
            currentPage = page;
            loadRecords();
        }

        async function deleteRecord(id) {
            if (!confirm('确定要删除这条推送记录吗？')) return;
            
            try {
                await fetch(`/api/v1/records/${id}`, { method: 'DELETE' });
                loadRecords();
            } catch (error) {
                alert('删除失败');
            }
        }

        async function loadSettings() {
            try {
                const response = await fetch('/api/v1/settings');
                currentSettings = await response.json();
                
                document.getElementById('barkServerUrl').value = currentSettings.bark_server_url || '';
                document.getElementById('cleanupDays').value = currentSettings.cleanup_days || '30';
                document.getElementById('cleanupEnabled').value = currentSettings.cleanup_enabled || 'true';
            } catch (error) {
                console.error('Error:', error);
            }
        }

        async function saveSettings() {
            const settings = {
                bark_server_url: document.getElementById('barkServerUrl').value,
                cleanup_days: document.getElementById('cleanupDays').value,
                cleanup_enabled: document.getElementById('cleanupEnabled').value
            };

            try {
                await fetch('/api/v1/settings', {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(settings)
                });
                closeModal('settingsModal');
                alert('✅ 设置已保存');
            } catch (error) {
                alert('❌ 保存失败');
            }
        }

        async function confirmCleanup() {
            const days = parseInt(document.getElementById('cleanupRange').value);
            const group = document.getElementById('cleanupGroup').value;
            const before = new Date(Date.now() - days * 24 * 60 * 60 * 1000).toISOString();
            
            if (!confirm(`⚠️ 确定要清理 ${days} 天前的所有记录吗？此操作不可恢复！`)) return;

            const params = new URLSearchParams({ before });
            if (group) params.append('group', group);

            try {
                const response = await fetch(`/api/v1/records?${params}`, { method: 'DELETE' });
                const data = await response.json();
                closeModal('cleanupModal');
                loadRecords();
                alert(`✅ 已清理 ${data.deleted_count} 条记录`);
            } catch (error) {
                alert('❌ 清理失败');
            }
        }

        function openSettings() {
            loadSettings();
            document.getElementById('settingsModal').classList.add('show');
        }

        function openCleanup() {
            document.getElementById('cleanupModal').classList.add('show');
        }

        function closeModal(id) {
            document.getElementById(id).classList.remove('show');
        }

        function handleSearch(event) {
            if (event.key === 'Enter') {
                currentPage = 1;
                loadRecords();
            }
        }

        function formatTime(isoString) {
            if (!isoString) return '未知时间';
            const date = new Date(isoString);
            const now = new Date();
            const diff = now - date;
            
            if (diff < 60000) return '刚刚';
            if (diff < 3600000) return `${Math.floor(diff / 60000)} 分钟前`;
            if (diff < 86400000) return `${Math.floor(diff / 3600000)} 小时前`;
            
            return date.toLocaleString('zh-CN', {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadRecords();
        });

        window.addEventListener('click', (e) => {
            if (e.target.classList.contains('modal')) {
                e.target.classList.remove('show');
            }
        });
    </script>
</body>
</html>
